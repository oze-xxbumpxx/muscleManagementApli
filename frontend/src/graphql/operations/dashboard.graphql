# =============================================================================
# muscleManagementApli - GraphQL Operations
# =============================================================================

# -----------------------------------------------------------------------------
# Dashboard
# -----------------------------------------------------------------------------

query StreakInfo {
  streakInfo {
    currentStreak
    longestStreak
    thisMonthCount
    totalCount
  }
}

query TrainingDaysInMonth($year: Int!, $month: Int!) {
  trainingDaysInMonth(year: $year, month: $month) {
    date
    exerciseCount
  }
}

query RecentExerciseFrequency($sessionCount: Int) {
  recentExerciseFrequency(sessionCount: $sessionCount) {
    exerciseName
    count
  }
}

query ExerciseConsecutiveCount($exerciseName: String!) {
  exerciseConsecutiveCount(exerciseName: $exerciseName)
}
